name: muuvelo_abp
description: "Muuvelo ABP: bill splitter with Supabase auth and sync (university assignment)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    # Custom illustrations; MuuveloIcon falls back to an icon until they exist.
    - assets/icons/
